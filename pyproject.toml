[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[project]
name = "py-devops"
version = "0.1.0"
description = "A simple CLI tool to check the status of the URLs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.28,<3.0",
    "click>=8.0,<9.0",
    "ruff>=0.16.2",
]

[project.scripts]
check-urls = "py_devops.cli:main"
