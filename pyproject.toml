[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[project]
name = "py-devops"
version = "0.1.0"
description = "A simple CLI tool to check the status of the URLs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28,<3.0",
    "click>=8.0,<9.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.2",
    "mypy",
    "bandit",
    "pytest",
    "pytest-mock"
]

[project.scripts]
check-urls = "py_devops.cli:main"

[tool.ruff]
line-length = 80
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true


[tool.bandit]
exclude_dirs = [".venv", "__pycache__", "build", "dist"]

[tool.pytest.ini_options]
addopts = "-rA -v"
testpaths = ["tests"]
