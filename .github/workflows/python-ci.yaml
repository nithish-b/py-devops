name: CI/CD for simple http checker

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  lint-static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set Up Python
        run: uv python install

      - name: Install Dependencies
        run: uv sync --extra dev --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format Check
        run: uv run ruff format --check .

      - name: Static Type Check
        run: uv run mypy src/

      - name: Security Check
        run: uv run bandit -c pyproject.toml -r .
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.13']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set Up Python
        run: uv python install

      - name: Install Dependencies
        run: uv sync --extra dev --locked

      - name: Pytest
        run: |
          uv run pytest
  release:
    runs-on: ubuntu-latest
    needs:
      - lint-static-checks
      - tests
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uvx --from python-semantic-release==10.6.1 semantic-release version
          uvx --from python-semantic-release==10.6.1 semantic-release publish
